<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnePal — AI Multi-Agent Platform</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<header class="header">
  <div class="header-left">
    <div class="header-logo">OP</div>
    <span class="header-title">OnePal</span>
    <span class="header-badge">P0</span>
  </div>
  <div class="header-right">
    <span class="header-clock" id="clock">--</span>
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text">Platform Initialized</span>
  </div>
</header>
<main class="main">
  <div class="section-title"><span class="icon">🧩</span>Agent Center</div>
  <div class="agent-grid" id="agent-grid"></div>

  <div class="section-title" style="margin-top:24px"><span class="icon">📋</span>Task Tree Viewer</div>
  <div class="card"><p style="color:var(--text-sub);font-size:13px">Task Tree Engine will display here in Phase 1.</p></div>

  <div class="row-2col" style="margin-top:24px">
    <section>
      <div class="section-title"><span class="icon">✅</span>Approval Queue</div>
      <div class="card"><p style="color:var(--text-sub);font-size:13px">No pending approvals.</p></div>
    </section>
    <section>
      <div class="section-title"><span class="icon">🧠</span>Memory Center</div>
      <div class="card"><p style="color:var(--text-sub);font-size:13px">Active: 0 | Pending: 0</p></div>
    </section>
  </div>

  <div class="row-2col" style="margin-top:24px">
    <section>
      <div class="section-title"><span class="icon">🛠</span>Skills Center</div>
      <div class="card"><p style="color:var(--text-sub);font-size:13px">No skills installed yet.</p></div>
    </section>
    <section>
      <div class="section-title"><span class="icon">📊</span>System Health</div>
      <div class="card"><p style="color:var(--text-sub);font-size:13px">All systems nominal. Clean rebuild P0.</p></div>
    </section>
  </div>
</main>
<script src="js/dashboard.js"></script>
</body>
</html>
