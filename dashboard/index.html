<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnePal Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>OnePal Dashboard</h1>
  <div class="header-info">
    <span class="api-badge" id="api-badge">API</span>
    <span class="api-url" id="api-url">http://127.0.0.1:18790</span>
    <button class="btn btn-sm" id="refresh-all-btn" title="Refresh all panels">Refresh All</button>
  </div>
</header>

<main class="grid">

  <!-- Health Panel -->
  <section class="panel health-panel" id="health-panel">
    <div class="panel-header">
      <h2>Health</h2>
      <span class="status-badge" id="health-status-badge">--</span>
    </div>
    <div class="panel-body" id="health-body">
      <div class="loading">Checking...</div>
    </div>
  </section>

  <!-- Command Panel -->
  <section class="panel command-panel" id="command-panel">
    <div class="panel-header">
      <h2>Command</h2>
    </div>
    <div class="panel-body">
      <div class="command-form">
        <input type="text" id="command-input" placeholder="e.g. run startup smoke test"
               maxlength="2000" autocomplete="off">
        <select id="profile-select">
          <option value="safe_readonly">safe_readonly</option>
          <option value="local_write_with_approval">local_write_with_approval</option>
        </select>
        <button class="btn btn-primary" id="command-submit-btn">Submit</button>
        <button class="btn btn-sm" id="command-clear-btn">Clear</button>
      </div>
      <div class="command-error" id="command-error"></div>
      <div class="command-result" id="command-result"></div>
    </div>
  </section>

  <!-- Tasks Panel -->
  <section class="panel tasks-panel" id="tasks-panel">
    <div class="panel-header">
      <h2>Tasks</h2>
      <button class="btn btn-sm" id="tasks-refresh-btn">Refresh</button>
    </div>
    <div class="panel-body" id="tasks-body">
      <div class="loading">Loading...</div>
    </div>
  </section>

  <!-- Task Runs Panel -->
  <section class="panel runs-panel" id="runs-panel">
    <div class="panel-header">
      <h2>Task Runs</h2>
      <button class="btn btn-sm" id="runs-refresh-btn">Refresh</button>
    </div>
    <div class="panel-body" id="runs-body">
      <div class="loading">Loading...</div>
    </div>
  </section>

  <!-- MAS Trace Panel -->
  <section class="panel trace-panel" id="trace-panel">
    <div class="panel-header">
      <h2>MAS Trace</h2>
      <button class="btn btn-sm" id="trace-refresh-btn">Refresh</button>
    </div>
    <div class="panel-body" id="trace-body">
      <div class="loading">Loading...</div>
    </div>
  </section>

  <!-- Memory Center Panel -->
  <section class="panel memory-panel" id="memory-panel">
    <div class="panel-header">
      <h2>Memory Center</h2>
      <button class="btn btn-sm" id="memory-refresh-btn">Refresh</button>
    </div>
    <div class="panel-body" id="memory-body">
      <div class="loading">Loading...</div>
    </div>
  </section>

</main>

<footer class="footer">
  <span>local only</span>
  <span>|</span>
  <span>no direct runtime access</span>
  <span>|</span>
  <span>no governance bypass</span>
</footer>

<script src="app.js"></script>
</body>
</html>
